{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oversight.fullname" . }}-minio
  labels:
    {{- include "oversight.labels" . | nindent 4 }}
    component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oversight.selectorLabels" . | nindent 6 }}
      component: minio
  template:
    metadata:
      labels:
        {{- include "oversight.selectorLabels" . | nindent 8 }}
        component: minio
    spec:
      containers:
      - name: minio
        image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
        imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
        command:
        - /bin/sh
        - -c
        - minio server /data --console-address ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.auth.rootUser | quote }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.minio.auth.rootPassword | quote }}
        ports:
        - name: api
          containerPort: {{ .Values.minio.service.apiPort }}
          protocol: TCP
        - name: console
          containerPort: {{ .Values.minio.service.consolePort }}
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 20
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          {{- toYaml .Values.minio.resources | nindent 10 }}
      volumes:
      - name: data
        {{- if .Values.minio.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "oversight.fullname" . }}-minio
        {{- else }}
        emptyDir: {}
        {{- end }}
{{- end }}
