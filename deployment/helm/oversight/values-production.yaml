# Production values for OverSight
# Use with: helm install oversight ./helm/oversight -f values-production.yaml

# Global settings
global:
  imageRegistry: "your-registry.com"
  imagePullSecrets:
    - name: registry-secret

# Backend
backend:
  image:
    repository: your-registry.com/oversight-backend
    tag: "1.0.0"
  replicaCount: 3
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: api.oversight.yourdomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: oversight-api-tls
        hosts:
          - api.oversight.yourdomain.com
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    DATABASE_URL: "postgresql://oversight:CHANGE_ME@postgres:5432/oversight"
    GEMINI_API_KEY: "CHANGE_ME"
    KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
    # Use secrets for sensitive values in production
  envFrom:
    - secretRef:
        name: oversight-secrets

# Frontend
frontend:
  image:
    repository: your-registry.com/oversight-frontend
    tag: "1.0.0"
  replicaCount: 3
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: oversight.yourdomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: oversight-frontend-tls
        hosts:
          - oversight.yourdomain.com
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70

# PostgreSQL
postgres:
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "fast-ssd"
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

# Redis
redis:
  master:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: "fast-ssd"
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# MinIO
minio:
  persistence:
    enabled: true
    size: 1Ti
    storageClass: "standard"
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

# Keycloak
keycloak:
  replicaCount: 2
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: auth.oversight.yourdomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-tls
        hosts:
          - auth.oversight.yourdomain.com
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

keycloakPostgres:
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: "fast-ssd"
