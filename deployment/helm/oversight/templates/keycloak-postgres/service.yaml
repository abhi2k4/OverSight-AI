{{- if and .Values.keycloak.enabled .Values.keycloakPostgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oversight.fullname" . }}-keycloak-postgres
  labels:
    {{- include "oversight.labels" . | nindent 4 }}
    component: keycloak-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "oversight.selectorLabels" . | nindent 4 }}
    component: keycloak-postgres
{{- end }}
