{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oversight.fullname" . }}-redis
  labels:
    {{- include "oversight.labels" . | nindent 4 }}
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "oversight.selectorLabels" . | nindent 4 }}
    component: redis
{{- end }}
